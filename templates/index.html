<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mike - Photorealistic AI Assistant</title>
    <style>
        :root {
            --color-background: #1f2121;
            --color-surface: #262828;
            --color-text: #f5f5f5;
            --color-primary: #32b8c6;
            --color-primary-hover: #2da6b2;
            --color-border: rgba(119, 124, 124, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--color-background);
            color: var(--color-text);
            overflow: hidden;
            height: 100vh;
        }

        .container {
            display: flex;
            height: 100vh;
            gap: 0;
        }

        .avatar-section {
            flex: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #avatarCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .controls-overlay {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
        }

        .btn {
            padding: 10px 16px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            backdrop-filter: blur(10px);
        }

        .btn:hover {
            background: rgba(0, 0, 0, 0.8);
            border-color: var(--color-primary);
        }

        .expression-controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            max-width: 300px;
        }

        .btn-small {
            padding: 8px 12px;
            font-size: 12px;
        }

        .chat-section {
            flex: 1;
            background: var(--color-surface);
            display: flex;
            flex-direction: column;
            padding: 24px;
        }

        .chat-header {
            padding-bottom: 16px;
            border-bottom: 1px solid var(--color-border);
        }

        .chat-header h2 {
            color: var(--color-primary);
            font-size: 24px;
            margin-bottom: 4px;
        }

        .chat-header p {
            color: rgba(245, 245, 245, 0.7);
            font-size: 14px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 80%;
            line-height: 1.5;
        }

        .bot-message {
            background: rgba(50, 184, 198, 0.15);
            border: 1px solid rgba(50, 184, 198, 0.25);
            align-self: flex-start;
        }

        .user-message {
            background: rgba(119, 124, 124, 0.15);
            border: 1px solid rgba(119, 124, 124, 0.3);
            align-self: flex-end;
        }

        .input-container {
            display: flex;
            gap: 12px;
            padding-top: 16px;
            border-top: 1px solid var(--color-border);
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            background: var(--color-background);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            color: var(--color-text);
            font-size: 14px;
        }

        input[type="text"]:focus {
            outline: 2px solid var(--color-primary);
            border-color: var(--color-primary);
        }

        .btn-primary {
            padding: 12px 24px;
            background: var(--color-primary);
            color: #134252;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary:hover {
            background: var(--color-primary-hover);
        }

        .status {
            font-size: 12px;
            color: rgba(245, 245, 245, 0.5);
            margin-top: 8px;
            text-align: center;
        }

        /* Scrollbar styling */
        .chat-messages::-webkit-scrollbar {
            width: 8px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: var(--color-background);
            border-radius: 4px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(119, 124, 124, 0.3);
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Avatar Section -->
        <div class="avatar-section">
            <img src="https://agi-prod-file-upload-public-main-use1.s3.amazonaws.com/1372db6f-d90f-4a2f-a51b-ed904cc30983" alt="Mike Avatar" class="avatar-image" />
            
        </div>

        <!-- Chat Section -->
        <div class="chat-section">
            <div class="chat-header">
                <h2>Mike - AI Assistant</h2>
                <p>Chat with your ultra-realistic 3D companion</p>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="message bot-message">
                    Hello! I'm Mike, your photorealistic AI assistant. How can I help you today?
                </div>
            </div>

            <div class="input-container">
                <input type="text" id="userInput" placeholder="Type your message here..." />
                <button class="btn-primary" onclick="sendMessage()">Send</button>
            </div>

            <div class="status" id="statusText">Ready to chat • Connected</div>
        </div>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // Global variables
        let scene, camera, renderer, avatar;
        let head, body, leftArm, rightArm, leftEye, rightEye, mouth;
        let currentExpression = 'neutral';
        let isTalking = false;
        let animationId;

        // Initialize Three.js scene
        function initAvatar() {
            const canvas = document.getElementById('avatarCanvas');
            
            // Setup scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x667eea);
            
            // Setup camera - adjusted to show full body including head
            camera = new THREE.PerspectiveCamera(
                50,
                canvas.clientWidth / canvas.clientHeight,
                0.1,
                1000
            );
            camera.position.set(0, 1.3, 3.2);
            camera.lookAt(0, 1.2, 0);
            
            // Setup renderer
            renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
            renderer.setSize(canvas.clientWidth, canvas.clientHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            
            // Add enhanced photorealistic lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            
            // Key light (main light - warmer tone)
            const keyLight = new THREE.DirectionalLight(0xfff4e6, 1.2);
            keyLight.position.set(5, 8, 5);
            keyLight.castShadow = true;
            keyLight.shadow.mapSize.width = 2048;
            keyLight.shadow.mapSize.height = 2048;
            scene.add(keyLight);
            
            // Fill light (softer, cooler - reduces harsh shadows)
            const fillLight = new THREE.DirectionalLight(0xb3d9ff, 0.4);
            fillLight.position.set(-4, 4, 3);
            scene.add(fillLight);
            
            // Rim light (separates subject from background)
            const rimLight = new THREE.DirectionalLight(0xffffff, 0.6);
            rimLight.position.set(0, 5, -5);
            scene.add(rimLight);
            
            // Hemisphere light (simulates sky/ground ambient)
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.3);
            scene.add(hemiLight);
            
            // Create realistic avatar
            createRealisticAvatar();
            
            // Handle window resize
            window.addEventListener('resize', onWindowResize);
            
            // Start animation loop
            animate();
            
            console.log('3D Avatar initialized successfully!');
        }

        function createRealisticAvatar() {
            avatar = new THREE.Group();
            
            // Enhanced photorealistic skin material
            const skinMaterial = new THREE.MeshStandardMaterial({
                color: 0xffd9c8,
                roughness: 0.45,
                metalness: 0.05,
                emissive: 0xffccbb,
                emissiveIntensity: 0.05
            });
            
            // Stylish jacket material (black leather-like)
            const jacketMaterial = new THREE.MeshStandardMaterial({
                color: 0x1a1a1a,
                roughness: 0.4,
                metalness: 0.3,
                envMapIntensity: 1.0
            });
            
            // White shirt material
            const shirtMaterial = new THREE.MeshStandardMaterial({
                color: 0xf5f5f5,
                roughness: 0.7,
                metalness: 0.0
            });
            
            // Stylish pants material
            const pantsMaterial = new THREE.MeshStandardMaterial({
                color: 0x2a2a2a,
                roughness: 0.6,
                metalness: 0.1
            });
            
            // Purple/violet hair material (like the image)
            const hairMaterial = new THREE.MeshStandardMaterial({
                color: 0x9370db,
                roughness: 0.6,
                metalness: 0.2,
                emissive: 0x7b5fa8,
                emissiveIntensity: 0.1
            });
            
            // HEAD (more detailed and realistic)
            head = new THREE.Mesh(
                new THREE.SphereGeometry(0.32, 64, 64),
                skinMaterial
            );
            head.position.y = 1.65;
            head.castShadow = true;
            head.receiveShadow = true;
            avatar.add(head);
            
            // HAIR (stylish purple bob cut - like the image)
            const hairTop = new THREE.Mesh(
                new THREE.SphereGeometry(0.34, 48, 48, 0, Math.PI * 2, 0, Math.PI * 0.55),
                hairMaterial
            );
            hairTop.position.y = 1.85;
            hairTop.castShadow = true;
            avatar.add(hairTop);
            
            // Hair sides (bob cut style)
            const hairSideLeft = new THREE.Mesh(
                new THREE.BoxGeometry(0.15, 0.35, 0.25),
                hairMaterial
            );
            hairSideLeft.position.set(-0.23, 1.65, 0);
            hairSideLeft.castShadow = true;
            avatar.add(hairSideLeft);
            
            const hairSideRight = hairSideLeft.clone();
            hairSideRight.position.set(0.23, 1.65, 0);
            avatar.add(hairSideRight);
            
            // Bangs
            const bangs = new THREE.Mesh(
                new THREE.BoxGeometry(0.35, 0.12, 0.15),
                hairMaterial
            );
            bangs.position.set(0, 1.78, 0.25);
            bangs.rotation.x = -0.2;
            bangs.castShadow = true;
            avatar.add(bangs);
            
            // EYES (more realistic with shine)
            const eyeMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xffffff,
                roughness: 0.2,
                metalness: 0.1
            });
            const irisMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x8b6f47,
                roughness: 0.3,
                metalness: 0.1
            });
            const pupilMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x000000,
                roughness: 0.1,
                metalness: 0.0
            });
            
            // Left Eye (larger and more detailed)
            leftEye = new THREE.Group();
            const leftEyeWhite = new THREE.Mesh(
                new THREE.SphereGeometry(0.07, 24, 24),
                eyeMaterial
            );
            const leftIris = new THREE.Mesh(
                new THREE.SphereGeometry(0.045, 24, 24),
                irisMaterial
            );
            leftIris.position.z = 0.035;
            const leftPupil = new THREE.Mesh(
                new THREE.SphereGeometry(0.022, 24, 24),
                pupilMaterial
            );
            leftPupil.position.z = 0.052;
            
            // Eye shine/reflection
            const eyeShine = new THREE.Mesh(
                new THREE.SphereGeometry(0.012, 12, 12),
                new THREE.MeshBasicMaterial({ color: 0xffffff })
            );
            eyeShine.position.set(-0.015, 0.02, 0.06);
            
            leftEye.add(leftEyeWhite, leftIris, leftPupil, eyeShine);
            leftEye.position.set(-0.11, 1.74, 0.27);
            avatar.add(leftEye);
            
            // Right Eye
            rightEye = leftEye.clone();
            rightEye.position.set(0.12, 1.75, 0.28);
            avatar.add(rightEye);
            
            // NOSE (more refined)
            const noseBridge = new THREE.Mesh(
                new THREE.BoxGeometry(0.03, 0.15, 0.08),
                skinMaterial
            );
            noseBridge.position.set(0, 1.67, 0.3);
            avatar.add(noseBridge);
            
            const noseTip = new THREE.Mesh(
                new THREE.SphereGeometry(0.035, 16, 16),
                skinMaterial
            );
            noseTip.position.set(0, 1.62, 0.33);
            noseTip.scale.set(1, 0.8, 1.2);
            avatar.add(noseTip);
            
            // Eyebrows
            const eyebrowMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x6b4e8d,
                roughness: 0.8
            });
            
            const leftEyebrow = new THREE.Mesh(
                new THREE.BoxGeometry(0.12, 0.02, 0.02),
                eyebrowMaterial
            );
            leftEyebrow.position.set(-0.11, 1.81, 0.3);
            leftEyebrow.rotation.z = -0.1;
            avatar.add(leftEyebrow);
            
            const rightEyebrow = leftEyebrow.clone();
            rightEyebrow.position.set(0.11, 1.81, 0.3);
            rightEyebrow.rotation.z = 0.1;
            avatar.add(rightEyebrow);
            
            // MOUTH (fuller lips)
            mouth = new THREE.Mesh(
                new THREE.BoxGeometry(0.18, 0.04, 0.03),
                new THREE.MeshStandardMaterial({ 
                    color: 0xd97c7c,
                    roughness: 0.4,
                    metalness: 0.1
                })
            );
            mouth.position.set(0, 1.56, 0.3);
            mouth.scale.set(1, 1, 1.2);
            avatar.add(mouth);
            
            // NECK
            const neck = new THREE.Mesh(
                new THREE.CylinderGeometry(0.11, 0.13, 0.2, 24),
                skinMaterial
            );
            neck.position.y = 1.35;
            neck.castShadow = true;
            avatar.add(neck);
            
            // BODY - White shirt underneath
            const innerShirt = new THREE.Mesh(
                new THREE.CylinderGeometry(0.28, 0.32, 0.7, 24),
                shirtMaterial
            );
            innerShirt.position.y = 0.9;
            innerShirt.castShadow = true;
            avatar.add(innerShirt);
            
            // BODY - Black jacket (open front style)
            body = new THREE.Mesh(
                new THREE.CylinderGeometry(0.3, 0.34, 0.75, 24),
                jacketMaterial
            );
            body.position.y = 0.88;
            body.castShadow = true;
            avatar.add(body);
            
            // Jacket collar
            const collarLeft = new THREE.Mesh(
                new THREE.BoxGeometry(0.12, 0.15, 0.05),
                jacketMaterial
            );
            collarLeft.position.set(-0.08, 1.2, 0.15);
            collarLeft.rotation.z = -0.3;
            avatar.add(collarLeft);
            
            const collarRight = collarLeft.clone();
            collarRight.position.set(0.08, 1.2, 0.15);
            collarRight.rotation.z = 0.3;
            avatar.add(collarRight);
            
            // ARMS (jacket sleeves) - with hands attached
            leftArm = new THREE.Group();
            const leftUpperArm = new THREE.Mesh(
                new THREE.CylinderGeometry(0.075, 0.065, 0.45, 20),
                jacketMaterial
            );
            leftUpperArm.position.y = -0.22;
            leftArm.add(leftUpperArm);
            
            const leftForearm = new THREE.Mesh(
                new THREE.CylinderGeometry(0.065, 0.055, 0.4, 20),
                jacketMaterial
            );
            leftForearm.position.y = -0.55;
            leftArm.add(leftForearm);
            
            const leftHand = new THREE.Mesh(
                new THREE.SphereGeometry(0.07, 20, 20),
                skinMaterial
            );
            leftHand.position.y = -0.85;
            leftHand.scale.set(1, 1.2, 0.8);
            leftHand.castShadow = true;
            leftHand.receiveShadow = true;
            leftArm.add(leftHand);
            
            leftArm.position.set(-0.38, 1.15, 0);
            leftArm.rotation.z = Math.PI / 9;
            leftArm.castShadow = true;
            avatar.add(leftArm);
            
            rightArm = new THREE.Group();
            const rightUpperArm = new THREE.Mesh(
                new THREE.CylinderGeometry(0.075, 0.065, 0.45, 20),
                jacketMaterial
            );
            rightUpperArm.position.y = -0.22;
            rightArm.add(rightUpperArm);
            
            const rightForearm = new THREE.Mesh(
                new THREE.CylinderGeometry(0.065, 0.055, 0.4, 20),
                jacketMaterial
            );
            rightForearm.position.y = -0.55;
            rightArm.add(rightForearm);
            
            const rightHand = new THREE.Mesh(
                new THREE.SphereGeometry(0.07, 20, 20),
                skinMaterial
            );
            rightHand.position.y = -0.85;
            rightHand.scale.set(1, 1.2, 0.8);
            rightHand.castShadow = true;
            rightHand.receiveShadow = true;
            rightArm.add(rightHand);
            
            rightArm.position.set(0.42, 1.15, 0);
            rightArm.rotation.z = -Math.PI / 8;
            rightArm.castShadow = true;
            avatar.add(rightArm);
            
            // LEGS
            const leftLeg = new THREE.Mesh(
                new THREE.CylinderGeometry(0.08, 0.07, 0.9, 16),
                pantsMaterial
            );
            leftLeg.position.set(-0.12, 0.1, 0);
            leftLeg.castShadow = true;
            leftLeg.receiveShadow = true;
            avatar.add(leftLeg);
            
            const rightLeg = new THREE.Mesh(
                new THREE.CylinderGeometry(0.08, 0.07, 0.9, 16),
                pantsMaterial
            );
            rightLeg.position.set(0.12, 0.1, 0);
            rightLeg.castShadow = true;
            rightLeg.receiveShadow = true;
            avatar.add(rightLeg);
            
            // SHOES
            const leftShoe = new THREE.Mesh(
                new THREE.BoxGeometry(0.15, 0.08, 0.25),
                new THREE.MeshStandardMaterial({ color: 0x1a1a1a })
            );
            leftShoe.position.set(-0.12, -0.45, 0.05);
            leftShoe.castShadow = true;
            avatar.add(leftShoe);
            
            const rightShoe = new THREE.Mesh(
                new THREE.BoxGeometry(0.15, 0.08, 0.25),
                new THREE.MeshStandardMaterial({ color: 0x1a1a1a })
            );
            rightShoe.position.set(0.12, -0.45, 0.05);
            rightShoe.castShadow = true;
            avatar.add(rightShoe);
            
            scene.add(avatar);
        }

        function animate() {
            animationId = requestAnimationFrame(animate);
            
            // Subtle idle animations
            const time = Date.now() * 0.001;
            
            if (!isTalking && avatar) {
                // Breathing
                body.scale.y = 1 + Math.sin(time * 1.2) * 0.02;
                
                // Slight head movement - more visible
                head.rotation.y = Math.sin(time * 0.3) * 0.05;
                head.rotation.x = Math.sin(time * 0.4) * 0.02;
                
                // Keep arms and legs stable during idle
                leftArm.rotation.z = Math.PI / 9 + Math.sin(time * 0.5) * 0.03;
                rightArm.rotation.z = -Math.PI / 8 + Math.sin(time * 0.5) * 0.02;
                
                // Occasional blink
                if (Math.random() < 0.005) {
                    blinkEyes();
                }
            }
            
            renderer.render(scene, camera);
        }

        function blinkEyes() {
            leftEye.scale.y = 0.1;
            rightEye.scale.y = 0.1;
            setTimeout(() => {
                leftEye.scale.y = 1;
                rightEye.scale.y = 1;
            }, 100);
        }

        function setExpression(expression) {
            currentExpression = expression;
            
            switch(expression) {
                case 'happy':
                    mouth.scale.x = 1.4;
                    mouth.scale.y = 0.8;
                    mouth.position.y = 1.57;
                    break;
                case 'sad':
                    mouth.scale.x = 1.2;
                    mouth.scale.y = 0.6;
                    mouth.position.y = 1.52;
                    mouth.rotation.z = Math.PI;
                    break;
                case 'surprised':
                    mouth.scale.set(1, 2, 1);
                    mouth.position.y = 1.53;
                    leftEye.scale.set(1.3, 1.3, 1.3);
                    rightEye.scale.set(1.3, 1.3, 1.3);
                    break;
                case 'neutral':
                default:
                    mouth.scale.set(1, 1, 1);
                    mouth.position.y = 1.55;
                    mouth.rotation.z = 0;
                    leftEye.scale.set(1, 1, 1);
                    rightEye.scale.set(1, 1, 1);
            }
        }

        function triggerGesture(gesture) {
            switch(gesture) {
                case 'wave':
                    waveHand();
                    break;
                case 'nod':
                    nodHead();
                    break;
            }
        }

        function waveHand() {
            const originalRotation = rightArm.rotation.z;
            let waveCount = 0;
            
            function wave() {
                rightArm.rotation.z = originalRotation - Math.PI / 3;
                setTimeout(() => {
                    rightArm.rotation.z = originalRotation - Math.PI / 4;
                    waveCount++;
                    if (waveCount < 3) {
                        setTimeout(wave, 200);
                    } else {
                        rightArm.rotation.z = originalRotation;
                    }
                }, 150);
            }
            
            wave();
        }

        function nodHead() {
            const originalRotation = head.rotation.x;
            head.rotation.x = originalRotation + 0.3;
            setTimeout(() => {
                head.rotation.x = originalRotation - 0.1;
                setTimeout(() => {
                    head.rotation.x = originalRotation;
                }, 150);
            }, 200);
        }

        function setCameraView(view) {
            switch(view) {
                case 'front':
                    camera.position.set(0, 1.6, 3);
                    camera.lookAt(0, 1.6, 0);
                    break;
                case 'side':
                    camera.position.set(3, 1.6, 0);
                    camera.lookAt(0, 1.6, 0);
                    break;
                case 'closeup':
                    camera.position.set(0, 1.7, 1.5);
                    camera.lookAt(0, 1.7, 0);
                    break;
            }
        }

        function startTalking() {
            isTalking = true;
            let mouthOpen = false;
            
            const talkInterval = setInterval(() => {
                mouthOpen = !mouthOpen;
                mouth.scale.y = mouthOpen ? 1.8 : 0.8;
            }, 150);
            
            return talkInterval;
        }

        function stopTalking(intervalId) {
            isTalking = false;
            clearInterval(intervalId);
            mouth.scale.y = 1;
        }

        function onWindowResize() {
            const canvas = document.getElementById('avatarCanvas');
            camera.aspect = canvas.clientWidth / canvas.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(canvas.clientWidth, canvas.clientHeight);
        }

        // Chat functionality
        function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            // Add user message
            addMessage(message, 'user');
            input.value = '';
            
            // Simulate bot response
            setTimeout(() => {
                const responses = [
                    "That's an interesting point! Tell me more.",
                    "I understand. How can I help you with that?",
                    "Great question! Let me think about that...",
                    "I'm here to assist you. What would you like to know?",
                    "That's a good observation. Would you like to explore this further?"
                ];
                
                const response = responses[Math.floor(Math.random() * responses.length)];
                addMessage(response, 'bot');
                
                // Make avatar talk
                const talkInterval = startTalking();
                setTimeout(() => stopTalking(talkInterval), 2000);
                
                // Random expression
                const expressions = ['happy', 'neutral', 'surprised'];
                setExpression(expressions[Math.floor(Math.random() * expressions.length)]);
            }, 1000);
        }

        function addMessage(text, sender) {
            const messagesDiv = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}-message`;
            messageDiv.textContent = text;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // Handle Enter key in input
        document.addEventListener('DOMContentLoaded', () => {
            const input = document.getElementById('userInput');
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });
            
            // Initialize avatar
            initAvatar();
        });
