<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mike - Photorealistic 3D AI Avatar with Voice</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0e27;
            color: #ffffff;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
        }

        .avatar-section {
            flex: 1;
            background: linear-gradient(135deg, #f5d5e8 0%, #e8d5f5 50%, #d5e8f5 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .avatar-label {
            position: absolute;
            bottom: 30px;
            left: 30px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 20px;
            border-radius: 10px;
            border: 2px solid rgba(100, 50, 150, 0.3);
            font-size: 13px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .avatar-label h3 {
            color: #6432aa;
            margin-bottom: 5px;
        }

        .avatar-label p {
            color: #666;
            font-size: 12px;
        }

        .emotion-label {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 15px;
            border-radius: 8px;
            border: 2px solid rgba(100, 50, 150, 0.3);
            color: #6432aa;
            font-size: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            border-left: 1px solid rgba(0, 160, 210, 0.2);
        }

        .chat-header {
            padding: 25px 30px;
            border-bottom: 1px solid rgba(0, 160, 210, 0.1);
        }

        .chat-header h1 {
            font-size: 26px;
            color: #00a0d2;
            margin-bottom: 8px;
        }

        .status {
            font-size: 13px;
            color: #b0b5c0;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #4ade80;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 25px 30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg {
            display: flex;
            gap: 10px;
            animation: msgSlide 0.3s ease;
        }

        @keyframes msgSlide {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .msg.user {
            justify-content: flex-end;
        }

        .msg-content {
            max-width: 70%;
            padding: 12px 15px;
            border-radius: 8px;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.4;
        }

        .msg.bot .msg-content {
            background: rgba(0, 160, 210, 0.15);
            border: 1px solid rgba(0, 160, 210, 0.3);
            color: #ffffff;
        }

        .msg.user .msg-content {
            background: linear-gradient(135deg, #00a0d2, #0078a8);
            color: #ffffff;
        }

        .input-area {
            padding: 20px 30px;
            border-top: 1px solid rgba(0, 160, 210, 0.1);
            background: rgba(10, 14, 39, 0.3);
        }

        .input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #msgInput {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid rgba(0, 160, 210, 0.3);
            background: rgba(26, 31, 58, 0.8);
            color: #ffffff;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }

        #msgInput:focus {
            outline: none;
            border-color: #00a0d2;
            background: rgba(26, 31, 58, 1);
        }

        #msgInput::placeholder {
            color: #b0b5c0;
        }

        .btn-send, .btn-voice {
            padding: 12px 20px;
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-send {
            background: linear-gradient(135deg, #00a0d2, #0078a8);
            padding: 12px 25px;
        }

        .btn-send:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 160, 210, 0.3);
        }

        .btn-send:active {
            transform: translateY(0);
        }

        .btn-voice {
            background: rgba(0, 160, 210, 0.2);
            border: 1px solid rgba(0, 160, 210, 0.5);
            color: #00a0d2;
            padding: 12px 18px;
        }

        .btn-voice:hover {
            background: rgba(0, 160, 210, 0.3);
        }

        .btn-voice.listening {
            background: rgba(255, 107, 107, 0.3);
            border-color: #ff6b6b;
            color: #ff6b6b;
            animation: micPulse 0.6s infinite;
        }

        @keyframes micPulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(255, 107, 107, 0.7);
            }
            50% {
                box-shadow: 0 0 0 8px rgba(255, 107, 107, 0);
            }
        }

        .btn-voice.speaking {
            background: rgba(76, 222, 128, 0.3);
            border-color: #4ade80;
            color: #4ade80;
            animation: speakPulse 0.6s infinite;
        }

        @keyframes speakPulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(76, 222, 128, 0.7);
            }
            50% {
                box-shadow: 0 0 0 8px rgba(76, 222, 128, 0);
            }
        }

        .footer {
            padding: 10px 30px;
            background: rgba(10, 14, 39, 0.2);
            border-top: 1px solid rgba(0, 160, 210, 0.1);
            font-size: 12px;
            color: #b0b5c0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .voice-status {
            font-size: 12px;
            color: #b0b5c0;
        }

        .messages::-webkit-scrollbar {
            width: 6px;
        }

        .messages::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }

        .messages::-webkit-scrollbar-thumb {
            background: rgba(0, 160, 210, 0.3);
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Avatar 3D -->
        <div class="avatar-section">
            <canvas id="renderCanvas"></canvas>
            <div class="emotion-label" id="emotionLabel">😊 Happy</div>
            <div class="avatar-label">
                <h3>🎀 Mia</h3>
                <p>Photorealistic 3D AI Avatar</p>
            </div>
        </div>

        <!-- Chat -->
        <div class="chat-section">
            <div class="chat-header">
                <h1>Chat with Mia</h1>
                <div class="status">
                    <span class="status-dot"></span>
                    <span id="statusText">Connected • Ready</span>
                </div>
            </div>

            <div class="messages" id="messagesBox">
                <div class="msg bot">
                    <div class="msg-content">
                        👋 Hi! I'm Mia, your AI assistant. You can text me or use voice! 🎤
                    </div>
                </div>
            </div>

            <div class="input-area">
                <div class="input-group">
                    <input 
                        type="text" 
                        id="msgInput" 
                        placeholder="Type your message or use voice..." 
                        autocomplete="off"
                    />
                    <button class="btn-voice" id="voiceBtn" title="Click to speak (🎤)">
                        🎤 Voice
                    </button>
                    <button class="btn-send" onclick="sendMsg()">
                        Send ➤
                    </button>
                </div>
            </div>

            <div class="footer">
                <span id="footerText">✓ Connected • Ready</span>
                <span id="voiceStatus" class="voice-status"></span>
            </div>
        </div>
    </div>

    <!-- Three.js for Realistic 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        console.log('🚀 Initializing photorealistic avatar with voice support...');
        
        let scene, camera, renderer, avatar;
        let isListening = false;
        let isSpeaking = false;
        const speechSynthesis = window.speechSynthesis;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        class RealisticAvatar {
            constructor() {
                this.group = new THREE.Group();
                this.isSpeaking = false;
                this.emotion = 'happy';
                this.createHead();
                this.createBody();
                this.createArms();
                this.createLegs();
            }

            createHead() {
                // Main head geometry
                const headGeo = new THREE.IcosahedronGeometry(0.25, 5);
                
                // Create canvas texture for face
                const canvas = document.createElement('canvas');
                canvas.width = 1024;
                canvas.height = 1024;
                const ctx = canvas.getContext('2d');
                
                // Skin tone background
                const gradient = ctx.createLinearGradient(0, 0, 0, 1024);
                gradient.addColorStop(0, '#f5d5c8');
                gradient.addColorStop(1, '#f0cfc2');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, 1024, 1024);
                
                // Simple face features for texture
                ctx.fillStyle = '#8b5a3c';
                ctx.beginPath();
                ctx.arc(350, 400, 60, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(650, 400, 60, 0, Math.PI * 2);
                ctx.fill();
                
                // Lips
                ctx.fillStyle = '#d4736f';
                ctx.beginPath();
                ctx.ellipse(500, 650, 120, 50, 0, 0, Math.PI * 2);
                ctx.fill();
                
                const texture = new THREE.CanvasTexture(canvas);
                const headMat = new THREE.MeshPhongMaterial({
                    map: texture,
                    shininess: 30,
                    emissive: 0xffc0a0
                });
                
                const head = new THREE.Mesh(headGeo, headMat);
                head.position.y = 0.6;
                this.group.add(head);
                this.head = head;

                // Hair - realistic purple/lavender color
                const hairGeo = new THREE.IcosahedronGeometry(0.27, 5);
                const hairMat = new THREE.MeshPhongMaterial({
                    color: 0xc89dd6,
                    shininess: 20,
                    emissive: 0xb07acc
                });
                const hair = new THREE.Mesh(hairGeo, hairMat);
                hair.position.y = 0.62;
                hair.scale.set(1, 1.2, 1);
                this.group.add(hair);

                // Eyes with realistic depth
                const eyeGeo = new THREE.SphereGeometry(0.04, 32, 32);
                const eyeMatL = new THREE.MeshPhongMaterial({
                    color: 0x3d5941,
                    shininess: 100,
                    emissive: 0x2d3931
                });
                
                const eyeL = new THREE.Mesh(eyeGeo, eyeMatL);
                eyeL.position.set(-0.085, 0.72, 0.24);
                this.group.add(eyeL);

                const eyeR = new THREE.Mesh(eyeGeo, eyeMatL);
                eyeR.position.set(0.085, 0.72, 0.24);
                this.group.add(eyeR);

                // Eye pupils
                const pupilGeo = new THREE.SphereGeometry(0.015, 16, 16);
                const pupilMat = new THREE.MeshPhongMaterial({
                    color: 0x000000,
                    shininess: 10,
                    emissive: 0x1a1a1a
                });
                
                const pupilL = new THREE.Mesh(pupilGeo, pupilMat);
                pupilL.position.set(-0.085, 0.72, 0.265);
                this.group.add(pupilL);
                this.pupilL = pupilL;

                const pupilR = new THREE.Mesh(pupilGeo, pupilMat);
                pupilR.position.set(0.085, 0.72, 0.265);
                this.group.add(pupilR);
                this.pupilR = pupilR;

                // Eyebrows
                const browGeo = new THREE.BoxGeometry(0.08, 0.012, 0.03);
                const browMat = new THREE.MeshPhongMaterial({
                    color: 0x8b6f47,
                    shininess: 5,
                    emissive: 0x6d5735
                });
                
                const browL = new THREE.Mesh(browGeo, browMat);
                browL.position.set(-0.085, 0.78, 0.24);
                browL.rotation.z = -0.2;
                this.group.add(browL);
                this.browL = browL;

                const browR = new THREE.Mesh(browGeo, browMat);
                browR.position.set(0.085, 0.78, 0.24);
                browR.rotation.z = 0.2;
                this.group.add(browR);
                this.browR = browR;

                // Nose
                const noseGeo = new THREE.ConeGeometry(0.02, 0.1, 8);
                const noseMat = new THREE.MeshPhongMaterial({
                    color: 0xf5d5c8,
                    shininess: 20
                });
                const nose = new THREE.Mesh(noseGeo, noseMat);
                nose.position.set(0, 0.65, 0.25);
                this.group.add(nose);

                // Mouth
                const mouthGeo = new THREE.BoxGeometry(0.08, 0.02, 0.02);
                const mouthMat = new THREE.MeshPhongMaterial({
                    color: 0xd4736f,
                    shininess: 40,
                    emissive: 0xb05a57
                });
                const mouth = new THREE.Mesh(mouthGeo, mouthMat);
                mouth.position.set(0, 0.55, 0.26);
                this.group.add(mouth);
                this.mouth = mouth;

                // Ears
                const earGeo = new THREE.SphereGeometry(0.03, 16, 16);
                const earMat = new THREE.MeshPhongMaterial({
                    color: 0xf5d5c8,
                    shininess: 25
                });
                
                const earL = new THREE.Mesh(earGeo, earMat);
                earL.position.set(-0.25, 0.65, 0);
                this.group.add(earL);

                const earR = new THREE.Mesh(earGeo, earMat);
                earR.position.set(0.25, 0.65, 0);
                this.group.add(earR);
            }

            createBody() {
                // Neck
                const neckGeo = new THREE.CylinderGeometry(0.08, 0.1, 0.1, 16);
                const neckMat = new THREE.MeshPhongMaterial({
                    color: 0xf5d5c8,
                    shininess: 25
                });
                const neck = new THREE.Mesh(neckGeo, neckMat);
                neck.position.y = 0.48;
                this.group.add(neck);

                // Torso - black jacket
                const torsoGeo = new THREE.ConeGeometry(0.18, 0.35, 16);
                const torsoMat = new THREE.MeshPhongMaterial({
                    color: 0x1a0f2e,
                    shininess: 15,
                    emissive: 0x0a050f
                });
                const torso = new THREE.Mesh(torsoGeo, torsoMat);
                torso.position.y = 0.3;
                this.group.add(torso);
                this.torso = torso;

                // White shirt under jacket
                const shirtGeo = new THREE.CylinderGeometry(0.12, 0.15, 0.25, 16);
                const shirtMat = new THREE.MeshPhongMaterial({
                    color: 0xffffff,
                    shininess: 20
                });
                const shirt = new THREE.Mesh(shirtGeo, shirtMat);
                shirt.position.y = 0.35;
                this.group.add(shirt);
            }

            createArms() {
                // Left arm
                const armGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.25, 16);
                const armMat = new THREE.MeshPhongMaterial({
                    color: 0xf5d5c8,
                    shininess: 25
                });
                
                const armL = new THREE.Mesh(armGeo, armMat);
                armL.position.set(-0.2, 0.45, 0);
                armL.rotation.z = 0.3;
                this.group.add(armL);
                this.armL = armL;

                const armR = new THREE.Mesh(armGeo, armMat);
                armR.position.set(0.2, 0.45, 0);
                armR.rotation.z = -0.3;
                this.group.add(armR);
                this.armR = armR;

                // Hands
                const handGeo = new THREE.SphereGeometry(0.035, 16, 16);
                const handMat = new THREE.MeshPhongMaterial({
                    color: 0xf5d5c8,
                    shininess: 25
                });
                
                const handL = new THREE.Mesh(handGeo, handMat);
                handL.position.set(-0.2, 0.3, 0);
                this.group.add(handL);

                const handR = new THREE.Mesh(handGeo, handMat);
                handR.position.set(0.2, 0.3, 0);
                this.group.add(handR);
            }

            createLegs() {
                // Left leg
                const legGeo = new THREE.CylinderGeometry(0.035, 0.035, 0.3, 16);
                const legMat = new THREE.MeshPhongMaterial({
                    color: 0x2a1a4a,
                    shininess: 10
                });
                
                const legL = new THREE.Mesh(legGeo, legMat);
                legL.position.set(-0.08, 0.05, 0);
                this.group.add(legL);

                const legR = new THREE.Mesh(legGeo, legMat);
                legR.position.set(0.08, 0.05, 0);
                this.group.add(legR);

                // Feet
                const footGeo = new THREE.BoxGeometry(0.06, 0.04, 0.15);
                const footMat = new THREE.MeshPhongMaterial({
                    color: 0x1a0f1a,
                    shininess: 5
                });
                
                const footL = new THREE.Mesh(footGeo, footMat);
                footL.position.set(-0.08, -0.15, 0);
                this.group.add(footL);

                const footR = new THREE.Mesh(footGeo, footMat);
                footR.position.set(0.08, -0.15, 0);
                this.group.add(footR);
            }

            startAnimations() {
                const animate = () => {
                    requestAnimationFrame(animate);
                    
                    const time = Date.now() * 0.001;
                    
                    // Breathing
                    this.torso.position.z = Math.sin(time * 1.5) * 0.01;
                    
                    // Head tilt
                    this.head.rotation.z = Math.sin(time * 0.5) * 0.05;
                    
                    // Blinking
                    const blink = Math.max(0, Math.sin(time * 1.5) - 0.9);
                    this.pupilL.scale.y = 1 - blink * 0.3;
                    this.pupilR.scale.y = 1 - blink * 0.3;

                    // Speaking animation
                    if (this.isSpeaking) {
                        this.mouth.scale.y = 0.8 + Math.sin(time * 8) * 0.5;
                        this.armL.rotation.z = 0.3 + Math.sin(time * 3) * 0.2;
                        this.armR.rotation.z = -0.3 - Math.sin(time * 3) * 0.2;
                    }
                };
                animate();
            }

            startSpeaking() {
                this.isSpeaking = true;
            }

            stopSpeaking() {
                this.isSpeaking = false;
                this.mouth.scale.y = 1;
                this.armL.rotation.z = 0.3;
                this.armR.rotation.z = -0.3;
            }

            setEmotion(emotion) {
                this.emotion = emotion;
                const emojis = {
                    'happy': '😊',
                    'sad': '😢',
                    'neutral': '😐',
                    'surprised': '😲'
                };
                document.getElementById('emotionLabel').textContent = 
                    `${emojis[emotion] || '😊'} ${emotion}`;

                if (emotion === 'happy') {
                    this.browL.rotation.z = -0.25;
                    this.browR.rotation.z = 0.25;
                    this.mouth.scale.x = 1.3;
                } else if (emotion === 'sad') {
                    this.browL.rotation.z = 0.15;
                    this.browR.rotation.z = -0.15;
                    this.mouth.scale.x = 0.8;
                }
            }
        }

        function init() {
            const canvas = document.getElementById('renderCanvas');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf5d5e8);
            scene.fog = new THREE.Fog(0xf5d5e8, 10, 20);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / 2 / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0.3, 0.8);

            renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
            renderer.setSize(window.innerWidth / 2, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFShadowShadowMap;

            // Lighting setup
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const keyLight = new THREE.DirectionalLight(0xffffff, 1);
            keyLight.position.set(1, 2, 2);
            keyLight.castShadow = true;
            keyLight.shadow.camera.left = -5;
            keyLight.shadow.camera.right = 5;
            keyLight.shadow.camera.top = 5;
            keyLight.shadow.camera.bottom = -5;
            scene.add(keyLight);

            const fillLight = new THREE.DirectionalLight(0xc0e0ff, 0.4);
            fillLight.position.set(-2, 1, 1);
            scene.add(fillLight);

            const rimLight = new THREE.PointLight(0xff99ff, 0.5);
            rimLight.position.set(0, 1, -2);
            scene.add(rimLight);

            // Create avatar
            avatar = new RealisticAvatar();
            scene.add(avatar.group);
            avatar.setEmotion('happy');
            avatar.startAnimations();

            // Render
            const animate = () => {
                requestAnimationFrame(animate);
                renderer.render(scene, camera);
            };
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = (window.innerWidth / 2) / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth / 2, window.innerHeight);
            });

            console.log('✓ Photorealistic avatar initialized');
        }

        // Speech Recognition
        function initVoiceInput() {
            if (!SpeechRecognition) {
                console.warn('Speech Recognition not supported');
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                isListening = true;
                document.getElementById('voiceBtn').classList.add('listening');
                document.getElementById('voiceStatus').textContent = '🎤 Listening...';
            };

            recognition.onresult = (event) => {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                document.getElementById('msgInput').value = transcript;
                sendMsg();
            };

            recognition.onend = () => {
                isListening = false;
                document.getElementById('voiceBtn').classList.remove('listening');
                document.getElementById('voiceStatus').textContent = '';
            };

            document.getElementById('voiceBtn').addEventListener('click', () => {
                if (!isListening) {
                    recognition.start();
                } else {
                    recognition.stop();
                }
            });
        }

        // Text to Speech
        function speak(text) {
            if (!speechSynthesis) return;

            speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1;
            utterance.pitch = 1.2;
            utterance.volume = 1;

            utterance.onstart = () => {
                isSpeaking = true;
                document.getElementById('voiceBtn').classList.add('speaking');
                if (avatar) avatar.startSpeaking();
            };

            utterance.onend = () => {
                isSpeaking = false;
                document.getElementById('voiceBtn').classList.remove('speaking');
                if (avatar) avatar.stopSpeaking();
            };

            speechSynthesis.speak(utterance);
        }

        // Chat
        function sendMsg() {
            const input = document.getElementById('msgInput');
            const msg = input.value.trim();
            if (!msg) return;

            addMsg(msg, 'user');
            input.value = '';

            fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: msg })
            })
            .then(r => r.json())
            .then(data => {
                if (data.response) {
                    addMsg(data.response, 'bot');
                    setTimeout(() => speak(data.response), 500);
                    
                    if (data.emotion && avatar) {
                        avatar.setEmotion(data.emotion.emotion);
                    }
                }
            })
            .catch(err => {
                console.error('Error:', err);
                addMsg('Connection error. Try again.', 'bot');
            });
        }

        function addMsg(text, role) {
            const box = document.getElementById('messagesBox');
            const div = document.createElement('div');
            div.className = 'msg ' + role;
            div.innerHTML = `<div class="msg-content">${text}</div>`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        window.addEventListener('load', () => {
            init();
            initVoiceInput();
        });

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('msgInput').addEventListener('keypress', e => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    sendMsg();
                }
            });
        });
    </script>
</body>
</html>
