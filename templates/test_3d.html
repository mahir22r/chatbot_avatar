<!DOCTYPE html>
<html>
<head>
    <title>3D Test</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; }
        #renderCanvas { width: 100%; height: 100vh; display: block; }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <script>
        const canvas = document.getElementById('renderCanvas');
        const engine = new BABYLON.Engine(canvas, true);
        const scene = new BABYLON.Scene(engine);
        
        // Create camera
        const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI/2, Math.PI/2.5, 3, new BABYLON.Vector3(0,1,0), scene);
        camera.attachControls(canvas);
        
        // Create light
        const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0,1,0), scene);
        light.intensity = 0.7;
        
        // Create sphere
        const sphere = BABYLON.MeshBuilder.CreateSphere("sphere", {diameter: 1}, scene);
        sphere.position.y = 1;
        
        // Create ground
        const ground = BABYLON.MeshBuilder.CreateGround("ground", {width: 6, height: 6}, scene);
        
        // Run render loop
        engine.runRenderLoop(() => {
            scene.render();
        });
        
        // Handle resize
        window.addEventListener('resize', () => {
            engine.resize();
        });
        
        console.log("3D test loaded successfully!");
    </script>
</body>
</html>
