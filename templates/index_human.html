<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mike - Realistic 3D AI Avatar with Voice</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0e27;
            color: #ffffff;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
        }

        .avatar-section {
            flex: 1;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .avatar-label {
            position: absolute;
            bottom: 30px;
            left: 30px;
            background: rgba(10, 14, 39, 0.95);
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid rgba(0, 160, 210, 0.3);
            font-size: 13px;
        }

        .avatar-label h3 {
            color: #00a0d2;
            margin-bottom: 5px;
        }

        .avatar-label p {
            color: #b0b5c0;
            font-size: 12px;
        }

        .emotion-label {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(10, 14, 39, 0.95);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid rgba(0, 160, 210, 0.3);
            color: #00a0d2;
            font-size: 12px;
        }

        .chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            border-left: 1px solid rgba(0, 160, 210, 0.2);
        }

        .chat-header {
            padding: 25px 30px;
            border-bottom: 1px solid rgba(0, 160, 210, 0.1);
        }

        .chat-header h1 {
            font-size: 26px;
            color: #00a0d2;
            margin-bottom: 8px;
        }

        .status {
            font-size: 13px;
            color: #b0b5c0;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #4ade80;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 25px 30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg {
            display: flex;
            gap: 10px;
            animation: msgSlide 0.3s ease;
        }

        @keyframes msgSlide {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .msg.user {
            justify-content: flex-end;
        }

        .msg-content {
            max-width: 70%;
            padding: 12px 15px;
            border-radius: 8px;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.4;
        }

        .msg.bot .msg-content {
            background: rgba(0, 160, 210, 0.15);
            border: 1px solid rgba(0, 160, 210, 0.3);
            color: #ffffff;
        }

        .msg.user .msg-content {
            background: linear-gradient(135deg, #00a0d2, #0078a8);
            color: #ffffff;
        }

        .input-area {
            padding: 20px 30px;
            border-top: 1px solid rgba(0, 160, 210, 0.1);
            background: rgba(10, 14, 39, 0.3);
        }

        .input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #msgInput {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid rgba(0, 160, 210, 0.3);
            background: rgba(26, 31, 58, 0.8);
            color: #ffffff;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }

        #msgInput:focus {
            outline: none;
            border-color: #00a0d2;
            background: rgba(26, 31, 58, 1);
        }

        #msgInput::placeholder {
            color: #b0b5c0;
        }

        .btn-send, .btn-voice {
            padding: 12px 20px;
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-send {
            background: linear-gradient(135deg, #00a0d2, #0078a8);
            padding: 12px 25px;
        }

        .btn-send:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 160, 210, 0.3);
        }

        .btn-send:active {
            transform: translateY(0);
        }

        .btn-voice {
            background: rgba(0, 160, 210, 0.2);
            border: 1px solid rgba(0, 160, 210, 0.5);
            color: #00a0d2;
            padding: 12px 18px;
        }

        .btn-voice:hover {
            background: rgba(0, 160, 210, 0.3);
        }

        .btn-voice.listening {
            background: rgba(255, 107, 107, 0.3);
            border-color: #ff6b6b;
            color: #ff6b6b;
            animation: micPulse 0.6s infinite;
        }

        @keyframes micPulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(255, 107, 107, 0.7);
            }
            50% {
                box-shadow: 0 0 0 8px rgba(255, 107, 107, 0);
            }
        }

        .btn-voice.speaking {
            background: rgba(76, 222, 128, 0.3);
            border-color: #4ade80;
            color: #4ade80;
            animation: speakPulse 0.6s infinite;
        }

        @keyframes speakPulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(76, 222, 128, 0.7);
            }
            50% {
                box-shadow: 0 0 0 8px rgba(76, 222, 128, 0);
            }
        }

        .footer {
            padding: 10px 30px;
            background: rgba(10, 14, 39, 0.2);
            border-top: 1px solid rgba(0, 160, 210, 0.1);
            font-size: 12px;
            color: #b0b5c0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .voice-status {
            font-size: 12px;
            color: #b0b5c0;
        }

        .messages::-webkit-scrollbar {
            width: 6px;
        }

        .messages::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }

        .messages::-webkit-scrollbar-thumb {
            background: rgba(0, 160, 210, 0.3);
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Avatar 3D -->
        <div class="avatar-section">
            <canvas id="renderCanvas"></canvas>
            <div class="emotion-label" id="emotionLabel">😊 Happy</div>
            <div class="avatar-label">
                <h3>🤖 Mike</h3>
                <p>Realistic AI Avatar</p>
            </div>
        </div>

        <!-- Chat -->
        <div class="chat-section">
            <div class="chat-header">
                <h1>Chat with Mike</h1>
                <div class="status">
                    <span class="status-dot"></span>
                    <span id="statusText">Connected • Ready</span>
                </div>
            </div>

            <div class="messages" id="messagesBox">
                <div class="msg bot">
                    <div class="msg-content">
                        👋 Hi! I'm Mike, your AI assistant. You can text me or use voice! 🎤
                    </div>
                </div>
            </div>

            <div class="input-area">
                <div class="input-group">
                    <input 
                        type="text" 
                        id="msgInput" 
                        placeholder="Type your message or use voice..." 
                        autocomplete="off"
                    />
                    <button class="btn-voice" id="voiceBtn" title="Click to speak (🎤)">
                        🎤 Voice
                    </button>
                    <button class="btn-send" onclick="sendMsg()">
                        Send ➤
                    </button>
                </div>
            </div>

            <div class="footer">
                <span id="footerText">✓ Connected • Ready</span>
                <span id="voiceStatus" class="voice-status"></span>
            </div>
        </div>
    </div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        console.log('🚀 Initializing realistic human avatar with better proportions...');
        
        let scene, camera, renderer, avatar;
        let isListening = false;
        let isSpeaking = false;
        const speechSynthesis = window.speechSynthesis;
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        class RealisticHumanAvatar {
            constructor() {
                this.group = new THREE.Group();
                this.isSpeaking = false;
                this.emotion = 'happy';
                this.createHead();
                this.createBody();
                this.createArms();
                this.createLegs();
            }

            createHead() {
                // Face - use sphere for more natural shape instead of box
                const faceGeo = new THREE.SphereGeometry(0.14, 64, 64);
                const faceMat = new THREE.MeshStandardMaterial({
                    color: 0xdb9a6a,
                    roughness: 0.35,
                    metalness: 0.02,
                    flatShading: false,
                    side: THREE.FrontSide
                });
                const face = new THREE.Mesh(faceGeo, faceMat);
                face.position.y = 1.08;
                face.scale.set(1.0, 1.15, 0.95); // Slight head shape adjustment
                face.castShadow = true;
                face.receiveShadow = true;
                this.group.add(face);
                this.head = face;

                // Cheeks - subtle color variation for more realism
                const cheekGeo = new THREE.SphereGeometry(0.04, 32, 32);
                const cheekMat = new THREE.MeshStandardMaterial({
                    color: 0xe5a08a,
                    roughness: 0.4,
                    metalness: 0,
                    transparent: true,
                    opacity: 0.6
                });
                const cheekL = new THREE.Mesh(cheekGeo, cheekMat);
                cheekL.position.set(-0.08, 1.02, 0.13);
                cheekL.scale.set(0.8, 1.2, 0.5);
                this.group.add(cheekL);

                const cheekR = new THREE.Mesh(cheekGeo, cheekMat);
                cheekR.position.set(0.08, 1.02, 0.13);
                cheekR.scale.set(0.8, 1.2, 0.5);
                this.group.add(cheekR);

                // Hair - more natural with better layering
                const hairGeo = new THREE.SphereGeometry(0.15, 48, 48);
                const hairMat = new THREE.MeshStandardMaterial({
                    color: 0x1a1a1a,
                    roughness: 0.8,
                    metalness: 0.05
                });
                const hair = new THREE.Mesh(hairGeo, hairMat);
                hair.position.y = 1.22;
                hair.scale.set(1.2, 1.5, 1.1);
                hair.castShadow = true;
                hair.receiveShadow = true;
                this.group.add(hair);

                // Hair strands front (bangs) for detail
                const bangsGeo = new THREE.BoxGeometry(0.18, 0.08, 0.05);
                const bangs = new THREE.Mesh(bangsGeo, hairMat);
                bangs.position.set(0, 1.15, 0.17);
                bangs.rotation.x = 0.2;
                bangs.castShadow = true;
                this.group.add(bangs);

                // Eyes - more detailed with highlights
                const eyeWhiteGeo = new THREE.SphereGeometry(0.032, 48, 48);
                const eyeWhiteMat = new THREE.MeshStandardMaterial({
                    color: 0xffffff,
                    roughness: 0.05,
                    metalness: 0,
                    emissive: 0xf0f0f0
                });
                
                const eyeL = new THREE.Mesh(eyeWhiteGeo, eyeWhiteMat);
                eyeL.position.set(-0.07, 1.12, 0.175);
                eyeL.castShadow = true;
                this.group.add(eyeL);

                const eyeR = new THREE.Mesh(eyeWhiteGeo, eyeWhiteMat);
                eyeR.position.set(0.07, 1.12, 0.175);
                eyeR.castShadow = true;
                this.group.add(eyeR);

                // Iris - more realistic with color variation
                const irisGeo = new THREE.SphereGeometry(0.018, 48, 48);
                const irisMat = new THREE.MeshStandardMaterial({
                    color: 0x7a5d3b,
                    roughness: 0.2,
                    metalness: 0.2,
                    emissive: 0x5a4d2b
                });
                
                const irisL = new THREE.Mesh(irisGeo, irisMat);
                irisL.position.set(-0.07, 1.12, 0.19);
                this.group.add(irisL);
                this.irisL = irisL;

                const irisR = new THREE.Mesh(irisGeo, irisMat);
                irisR.position.set(0.07, 1.12, 0.19);
                this.group.add(irisR);
                this.irisR = irisR;

                // Pupils - glossy black
                const pupilGeo = new THREE.SphereGeometry(0.008, 32, 32);
                const pupilMat = new THREE.MeshStandardMaterial({
                    color: 0x000000,
                    roughness: 0.05,
                    metalness: 0.1,
                    emissive: 0x0a0a0a
                });
                
                const pupilL = new THREE.Mesh(pupilGeo, pupilMat);
                pupilL.position.set(-0.07, 1.12, 0.205);
                this.group.add(pupilL);
                this.pupilL = pupilL;

                const pupilR = new THREE.Mesh(pupilGeo, pupilMat);
                pupilR.position.set(0.07, 1.12, 0.205);
                this.group.add(pupilR);
                this.pupilR = pupilR;

                // Eye shine/highlights for lifelike appearance
                const shineGeo = new THREE.SphereGeometry(0.004, 16, 16);
                const shineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                
                const shineL = new THREE.Mesh(shineGeo, shineMat);
                shineL.position.set(-0.072, 1.125, 0.215);
                this.group.add(shineL);

                const shineR = new THREE.Mesh(shineGeo, shineMat);
                shineR.position.set(0.072, 1.125, 0.215);
                this.group.add(shineR);

                // Eyebrows - more expressive
                const browGeo = new THREE.BoxGeometry(0.08, 0.01, 0.02);
                const browMat = new THREE.MeshStandardMaterial({
                    color: 0x2d2d2d,
                    roughness: 0.6,
                    metalness: 0
                });
                
                const browL = new THREE.Mesh(browGeo, browMat);
                browL.position.set(-0.065, 1.21, 0.175);
                browL.rotation.z = -0.25;
                browL.castShadow = true;
                this.group.add(browL);
                this.browL = browL;

                const browR = new THREE.Mesh(browGeo, browMat);
                browR.position.set(0.065, 1.21, 0.175);
                browR.rotation.z = 0.25;
                browR.castShadow = true;
                this.group.add(browR);
                this.browR = browR;

                // Nose - more detailed
                const noseBridgeGeo = new THREE.BoxGeometry(0.02, 0.08, 0.035);
                const noseMat = new THREE.MeshStandardMaterial({
                    color: 0xc99968,
                    roughness: 0.35,
                    metalness: 0
                });
                const noseBridge = new THREE.Mesh(noseBridgeGeo, noseMat);
                noseBridge.position.set(0, 1.08, 0.18);
                noseBridge.castShadow = true;
                this.group.add(noseBridge);

                const noseTipGeo = new THREE.SphereGeometry(0.028, 32, 32);
                const noseTip = new THREE.Mesh(noseTipGeo, noseMat);
                noseTip.position.set(0, 1.0, 0.195);
                noseTip.scale.set(0.8, 1.0, 1.2);
                noseTip.castShadow = true;
                this.group.add(noseTip);

                // Mouth - realistic lips with gradient
                const mouthGeo = new THREE.BoxGeometry(0.075, 0.022, 0.018);
                const mouthMat = new THREE.MeshStandardMaterial({
                    color: 0xd08080,
                    roughness: 0.3,
                    metalness: 0.15,
                    emissive: 0xa06060
                });
                const mouth = new THREE.Mesh(mouthGeo, mouthMat);
                mouth.position.set(0, 0.97, 0.18);
                mouth.castShadow = true;
                this.group.add(mouth);
                this.mouth = mouth;

                // Ears - sculpted shape
                const earGeo = new THREE.SphereGeometry(0.026, 32, 32);
                const earMat = new THREE.MeshStandardMaterial({
                    color: 0xd9967d,
                    roughness: 0.45,
                    metalness: 0
                });
                
                const earL = new THREE.Mesh(earGeo, earMat);
                earL.position.set(-0.26, 1.08, 0.08);
                earL.scale.set(0.9, 1.3, 0.6);
                earL.castShadow = true;
                this.group.add(earL);

                const earR = new THREE.Mesh(earGeo, earMat);
                earR.position.set(0.26, 1.08, 0.08);
                earR.scale.set(0.9, 1.3, 0.6);
                earR.castShadow = true;
                this.group.add(earR);
            }

            createBody() {
                const skinMat = new THREE.MeshStandardMaterial({
                    color: 0xdb9a6a,
                    roughness: 0.38,
                    metalness: 0.02
                });

                // Neck - more detailed and realistic
                const neckGeo = new THREE.CylinderGeometry(0.068, 0.078, 0.12, 20);
                const neck = new THREE.Mesh(neckGeo, skinMat);
                neck.position.y = 0.82;
                neck.castShadow = true;
                neck.receiveShadow = true;
                this.group.add(neck);

                // Upper torso/chest - better proportions
                const chestGeo = new THREE.BoxGeometry(0.3, 0.28, 0.15);
                const chestMat = new THREE.MeshStandardMaterial({
                    color: 0xf5f5f5,
                    roughness: 0.5,
                    metalness: 0.01
                });
                const chest = new THREE.Mesh(chestGeo, chestMat);
                chest.position.y = 0.7;
                chest.castShadow = true;
                chest.receiveShadow = true;
                this.group.add(chest);

                // Lower torso/waist - realistic tapering
                const waistGeo = new THREE.BoxGeometry(0.25, 0.25, 0.13);
                const waistMat = new THREE.MeshStandardMaterial({
                    color: 0x2a2a3a,
                    roughness: 0.6,
                    metalness: 0.05
                });
                const waist = new THREE.Mesh(waistGeo, waistMat);
                waist.position.y = 0.35;
                waist.castShadow = true;
                waist.receiveShadow = true;
                this.group.add(waist);
                this.torso = waist; // Store reference for animations

                // Jacket/shirt layering for depth
                const jacketGeo = new THREE.CylinderGeometry(0.155, 0.165, 0.28, 20);
                const jacketMat = new THREE.MeshStandardMaterial({
                    color: 0x1a1a2e,
                    roughness: 0.7,
                    metalness: 0.08
                });
                const jacket = new THREE.Mesh(jacketGeo, jacketMat);
                jacket.position.y = 0.68;
                jacket.castShadow = true;
                this.group.add(jacket);
            }

            createArms() {
                const skinMat = new THREE.MeshStandardMaterial({
                    color: 0xdb9a6a,
                    roughness: 0.38,
                    metalness: 0.02
                });

                // LEFT ARM - more realistic proportions
                const armLGroup = new THREE.Group();
                
                const upperArmLGeo = new THREE.CylinderGeometry(0.038, 0.032, 0.28, 16);
                const armMat = new THREE.MeshStandardMaterial({
                    color: 0xb88860,
                    roughness: 0.45,
                    metalness: 0.02
                });
                const upperArmL = new THREE.Mesh(upperArmLGeo, armMat);
                upperArmL.position.y = 0;
                upperArmL.castShadow = true;
                upperArmL.receiveShadow = true;
                armLGroup.add(upperArmL);

                const forearmLGeo = new THREE.CylinderGeometry(0.028, 0.024, 0.26, 16);
                const forearmL = new THREE.Mesh(forearmLGeo, armMat);
                forearmL.position.set(0, -0.27, 0);
                forearmL.rotation.z = -0.15;
                forearmL.castShadow = true;
                armLGroup.add(forearmL);

                // LEFT HAND - detailed and realistic
                const handLGeo = new THREE.SphereGeometry(0.032, 32, 32);
                const handL = new THREE.Mesh(handLGeo, skinMat);
                handL.position.set(0, -0.52, 0);
                handL.scale.set(1.1, 1.2, 0.85);
                handL.castShadow = true;
                handL.receiveShadow = true;
                armLGroup.add(handL);
                
                armLGroup.position.set(-0.24, 0.68, 0);
                armLGroup.rotation.z = 0.32;
                armLGroup.castShadow = true;
                this.group.add(armLGroup);
                this.armL = armLGroup;

                // RIGHT ARM - mirrored
                const armRGroup = new THREE.Group();
                
                const upperArmRGeo = new THREE.CylinderGeometry(0.038, 0.032, 0.28, 16);
                const upperArmR = new THREE.Mesh(upperArmRGeo, armMat);
                upperArmR.position.y = 0;
                upperArmR.castShadow = true;
                upperArmR.receiveShadow = true;
                armRGroup.add(upperArmR);

                const forearmRGeo = new THREE.CylinderGeometry(0.028, 0.024, 0.26, 16);
                const forearmR = new THREE.Mesh(forearmRGeo, armMat);
                forearmR.position.set(0, -0.27, 0);
                forearmR.rotation.z = 0.15;
                forearmR.castShadow = true;
                armRGroup.add(forearmR);

                // RIGHT HAND - detailed and realistic
                const handRGeo = new THREE.SphereGeometry(0.032, 32, 32);
                const handR = new THREE.Mesh(handRGeo, skinMat);
                handR.position.set(0, -0.52, 0);
                handR.scale.set(1.1, 1.2, 0.85);
                handR.castShadow = true;
                handR.receiveShadow = true;
                armRGroup.add(handR);
                
                armRGroup.position.set(0.24, 0.68, 0);
                armRGroup.rotation.z = -0.32;
                armRGroup.castShadow = true;
                this.group.add(armRGroup);
                this.armR = armRGroup;
            }

            createLegs() {
                // Thighs - realistic proportions
                const thighGeo = new THREE.CylinderGeometry(0.048, 0.042, 0.32, 16);
                const legMat = new THREE.MeshStandardMaterial({
                    color: 0x2a2a3a,
                    roughness: 0.6,
                    metalness: 0.02
                });
                
                const thighL = new THREE.Mesh(thighGeo, legMat);
                thighL.position.set(-0.09, 0.28, 0);
                thighL.castShadow = true;
                thighL.receiveShadow = true;
                this.group.add(thighL);

                const thighR = new THREE.Mesh(thighGeo, legMat);
                thighR.position.set(0.09, 0.28, 0);
                thighR.castShadow = true;
                thighR.receiveShadow = true;
                this.group.add(thighR);

                // Calves - detailed legs
                const calfGeo = new THREE.CylinderGeometry(0.036, 0.03, 0.32, 16);
                const calfL = new THREE.Mesh(calfGeo, legMat);
                calfL.position.set(-0.09, 0.02, 0);
                calfL.castShadow = true;
                this.group.add(calfL);

                const calfR = new THREE.Mesh(calfGeo, legMat);
                calfR.position.set(0.09, 0.02, 0);
                calfR.castShadow = true;
                this.group.add(calfR);

                // Feet - realistic shoe shape
                const footGeo = new THREE.BoxGeometry(0.068, 0.07, 0.145);
                const footMat = new THREE.MeshStandardMaterial({
                    color: 0x1a1a1a,
                    roughness: 0.7,
                    metalness: 0.05
                });
                
                const footL = new THREE.Mesh(footGeo, footMat);
                footL.position.set(-0.09, -0.195, 0.02);
                footL.castShadow = true;
                this.group.add(footL);

                const footR = new THREE.Mesh(footGeo, footMat);
                footR.position.set(0.09, -0.195, 0.02);
                footR.castShadow = true;
                this.group.add(footR);
            }

            startAnimations() {
                const animate = () => {
                    requestAnimationFrame(animate);
                    
                    const time = Date.now() * 0.001;
                    
                    // Breathing
                    this.torso.position.z = Math.sin(time * 1.2) * 0.012;
                    
                    // Head tilt
                    this.head.rotation.z = Math.sin(time * 0.5) * 0.03;
                    
                    // Blinking
                    const blink = Math.max(0, Math.sin(time * 1.5) - 0.92);
                    this.pupilL.scale.y = 1 - blink * 0.5;
                    this.pupilR.scale.y = 1 - blink * 0.5;

                    // Speaking animation
                    if (this.isSpeaking) {
                        this.mouth.scale.y = 0.5 + Math.sin(time * 8) * 0.8;
                        this.armL.rotation.z = 0.3 + Math.sin(time * 3) * 0.2;
                        this.armR.rotation.z = -0.3 - Math.sin(time * 3) * 0.2;
                    }
                };
                animate();
            }

            startSpeaking() {
                this.isSpeaking = true;
            }

            stopSpeaking() {
                this.isSpeaking = false;
                this.mouth.scale.y = 1;
                this.armL.rotation.z = 0.3;
                this.armR.rotation.z = -0.3;
            }

            setEmotion(emotion) {
                this.emotion = emotion;
                const emojis = {
                    'happy': '😊',
                    'sad': '😢',
                    'neutral': '😐',
                    'surprised': '😲'
                };
                document.getElementById('emotionLabel').textContent = 
                    `${emojis[emotion] || '😊'} ${emotion}`;

                if (emotion === 'happy') {
                    this.browL.rotation.z = -0.25;
                    this.browR.rotation.z = 0.25;
                    this.mouth.scale.x = 1.4;
                } else if (emotion === 'sad') {
                    this.browL.rotation.z = 0.25;
                    this.browR.rotation.z = -0.25;
                    this.mouth.scale.x = 0.5;
                } else if (emotion === 'surprised') {
                    this.browL.rotation.z = -0.4;
                    this.browR.rotation.z = 0.4;
                    this.mouth.scale.y = 2;
                } else {
                    this.browL.rotation.z = -0.15;
                    this.browR.rotation.z = 0.15;
                    this.mouth.scale.x = 1;
                }
            }
        }

        function init() {
            const canvas = document.getElementById('renderCanvas');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);
            scene.fog = new THREE.Fog(0x1a1a2e, 10, 20);

            camera = new THREE.PerspectiveCamera(75, (window.innerWidth / 2) / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0.5, 1.3);

            renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
            renderer.setSize(window.innerWidth / 2, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFShadowShadowMap;
            renderer.shadowMap.autoUpdate = true;

            // Enhanced professional lighting for photorealism
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.55);
            scene.add(ambientLight);

            // Key light (main light source - warm tone for natural look)
            const keyLight = new THREE.DirectionalLight(0xfff4e6, 1.1);
            keyLight.position.set(2.5, 3, 2);
            keyLight.castShadow = true;
            keyLight.shadow.camera.left = -6;
            keyLight.shadow.camera.right = 6;
            keyLight.shadow.camera.top = 6;
            keyLight.shadow.camera.bottom = -6;
            keyLight.shadow.mapSize.width = 4096;
            keyLight.shadow.mapSize.height = 4096;
            keyLight.shadow.bias = -0.001;
            scene.add(keyLight);

            // Fill light (reduces harsh shadows - cooler tone)
            const fillLight = new THREE.DirectionalLight(0xb3d9ff, 0.5);
            fillLight.position.set(-2, 2, 1.5);
            scene.add(fillLight);

            // Rim light (adds edge definition - separates subject from background)
            const rimLight = new THREE.PointLight(0xffffff, 0.4);
            rimLight.position.set(0, 1.5, -2.5);
            scene.add(rimLight);

            // Subtle ground reflection light
            const groundLight = new THREE.DirectionalLight(0xffffff, 0.2);
            groundLight.position.set(0, -1, 0);
            scene.add(groundLight);

            // Create avatar
            avatar = new RealisticHumanAvatar();
            scene.add(avatar.group);
            avatar.setEmotion('happy');
            avatar.startAnimations();

            // Render loop
            const animate = () => {
                requestAnimationFrame(animate);
                renderer.render(scene, camera);
            };
            animate();

            window.addEventListener('resize', () => {
                const width = window.innerWidth / 2;
                const height = window.innerHeight;
                camera.aspect = width / height;
                camera.updateProjectionMatrix();
                renderer.setSize(width, height);
            });

            console.log('✓ Avatar with improved proportions initialized');
        }

        // Voice
        function initVoiceInput() {
            if (!SpeechRecognition) return;

            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                isListening = true;
                document.getElementById('voiceBtn').classList.add('listening');
                document.getElementById('voiceStatus').textContent = '🎤 Listening...';
            };

            recognition.onresult = (event) => {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                document.getElementById('msgInput').value = transcript;
                sendMsg();
            };

            recognition.onend = () => {
                isListening = false;
                document.getElementById('voiceBtn').classList.remove('listening');
                document.getElementById('voiceStatus').textContent = '';
            };

            document.getElementById('voiceBtn').addEventListener('click', () => {
                if (!isListening) {
                    recognition.start();
                } else {
                    recognition.stop();
                }
            });
        }

        // TTS
        function speak(text) {
            if (!speechSynthesis) return;
            speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.95;
            utterance.pitch = 1.1;
            utterance.volume = 1;

            utterance.onstart = () => {
                isSpeaking = true;
                document.getElementById('voiceBtn').classList.add('speaking');
                if (avatar) avatar.startSpeaking();
            };

            utterance.onend = () => {
                isSpeaking = false;
                document.getElementById('voiceBtn').classList.remove('speaking');
                if (avatar) avatar.stopSpeaking();
            };

            speechSynthesis.speak(utterance);
        }

        // Chat
        function sendMsg() {
            const input = document.getElementById('msgInput');
            const msg = input.value.trim();
            if (!msg) return;

            addMsg(msg, 'user');
            input.value = '';

            fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: msg })
            })
            .then(r => r.json())
            .then(data => {
                if (data.response) {
                    addMsg(data.response, 'bot');
                    setTimeout(() => speak(data.response), 500);
                    if (data.emotion && avatar) {
                        avatar.setEmotion(data.emotion.emotion);
                    }
                }
            })
            .catch(err => {
                console.error('Error:', err);
                addMsg('Connection error. Try again.', 'bot');
            });
        }

        function addMsg(text, role) {
            const box = document.getElementById('messagesBox');
            const div = document.createElement('div');
            div.className = 'msg ' + role;
            div.innerHTML = `<div class="msg-content">${text}</div>`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        window.addEventListener('load', () => {
            init();
            initVoiceInput();
        });

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('msgInput').addEventListener('keypress', e => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    sendMsg();
                }
            });
        });
    </script>
</body>
</html>
